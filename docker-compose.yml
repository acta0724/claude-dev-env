services:
  claude:
    build: .
    stdin_open: true
    tty: true
    volumes:
      - ${PROJECT:-./workspace}:/workspace
      - claude-config:/root/.claude
    working_dir: /workspace

  claude-api:
    build: .
    stdin_open: true
    tty: true
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ${PROJECT:-./workspace}:/workspace
      - claude-config:/root/.claude
    working_dir: /workspace

volumes:
  claude-config:
